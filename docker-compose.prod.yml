services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discount
      POSTGRES_USER: discount
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-discount}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount -d discount"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/petrol-pump-discount/discount_service/backend:latest
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/discount
      DATABASE_USER: discount
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-discount}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-latest}
      UPLOAD_DIR: /data/uploads
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
      PUMP_LAT: ${PUMP_LAT:-13.765987}
      PUMP_LNG: ${PUMP_LNG:-76.852652}
      PUMP_RADIUS_METERS: ${PUMP_RADIUS_METERS:-50}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/petrol-pump-discount/discount_service/frontend:latest
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
