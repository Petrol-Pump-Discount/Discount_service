services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discount
      POSTGRES_USER: discount
      POSTGRES_PASSWORD: discount
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount -d discount"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/discount
      DATABASE_USER: discount
      DATABASE_PASSWORD: discount
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      UPLOAD_DIR: /data/uploads
      # leave empty in real prod to disable fixed OTP; for first live demo you may set OTP_DEV_CODE=123456
      OTP_DEV_CODE: ${OTP_DEV_CODE:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
