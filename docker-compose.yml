services:
  # Local-only Postgres. Production uses Neon — see docker-compose.prod.yml + docs/HOSTING.md
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: discount
      POSTGRES_USER: discount
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-discount}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discount -d discount"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/discount
      DATABASE_USER: discount
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-discount}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY:-}
      OCR_MODE: ${OCR_MODE:-auto}
      UPLOAD_DIR: /data/uploads
      OTP_PROVIDER: ${OTP_PROVIDER:-console}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      OTP_SMS_TEMPLATE: ${OTP_SMS_TEMPLATE:-}
      PUMP_LAT: ${PUMP_LAT:-13.765987}
      PUMP_LNG: ${PUMP_LNG:-76.852652}
      PUMP_RADIUS_METERS: ${PUMP_RADIUS_METERS:-50}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "8080:8080"

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
