spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://postgres:5432/discount}
    username: ${DATABASE_USER:discount}
    password: ${DATABASE_PASSWORD:discount}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  otp-dev-code: ${OTP_DEV_CODE:}
  pump:
    lat: ${PUMP_LAT:13.765987}
    lng: ${PUMP_LNG:76.852652}
    radius-meters: ${PUMP_RADIUS_METERS:50}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-latest}
server:
  port: ${PORT:8080}
