spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Neon Launch bills compute while awake — drop idle connections so DB can scale to zero.
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: 0
      connection-timeout: 20000
      idle-timeout: 60000
      max-lifetime: 300000
      keepalive-time: 0
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
app:
  upload-dir: ${UPLOAD_DIR:/data/uploads}
  otp:
    provider: ${OTP_PROVIDER:twilio}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    sms-template: "${OTP_SMS_TEMPLATE:Your OTP for Nagashree Service Station Login is: {otp}}"
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  pump:
    lat: ${PUMP_LAT:13.765987}
    lng: ${PUMP_LNG:76.852652}
    radius-meters: ${PUMP_RADIUS_METERS:50}
  gemini:
    api-key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL:gemini-flash-latest}
  ocr:
    mode: ${OCR_MODE:auto}
server:
  port: ${PORT:8080}
  # behind Cloudflare / reverse proxy
  forward-headers-strategy: framework
