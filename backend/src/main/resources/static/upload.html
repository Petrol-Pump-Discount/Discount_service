<!doctype html><html><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Upload bill</title><link rel="stylesheet" href="/css/app.css"/><script src="/js/api.js"></script></head>
<body><div class="wrap">
<a href="/" class="muted">← Home</a>
<h1>Upload bill</h1>
<div class="card">
  <p class="muted">No login needed. Account must exist with this vehicle linked. Bill fields are read by Gemini from the photo.</p>
  <label>Phone</label><input id="phone" inputmode="numeric"/>
  <label>Vehicle number</label><input id="vehicleNo" placeholder="Must match bill"/>
  <label>Bill photo (camera only)</label>
  <input id="image" type="file" accept="image/*" capture="environment"/>
  <button onclick="submit()">Submit for verification</button>
  <p id="msg" class="muted"></p>
</div>
<script>
async function submit(){
  msg.className='muted'; msg.textContent='Getting location + reading bill…';
  try {
    const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{enableHighAccuracy:true,timeout:15000}));
    const fd = new FormData();
    fd.append('phone', phone.value);
    fd.append('vehicleNo', vehicleNo.value);
    fd.append('lat', pos.coords.latitude);
    fd.append('lng', pos.coords.longitude);
    if (!image.files[0]) throw new Error('Take a camera photo');
    fd.append('image', image.files[0]);
    const res = await fetch('/api/claims/upload',{method:'POST',body:fd});
    const data = await res.json().catch(()=>({}));
    if (!res.ok) throw new Error(data.message || JSON.stringify(data));
    msg.className='ok';
    msg.textContent = data.message + ' Receipt ' + data.receiptKey + ' · ' + data.volumeLitres + ' L';
  } catch(e){ msg.className='bad'; msg.textContent=e.message; }
}
</script>
</div></body></html>
