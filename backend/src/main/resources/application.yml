server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/discount;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
app:
  upload-dir: ./uploads
  otp-dev-code: "123456"
  session-header: X-Session-Token
