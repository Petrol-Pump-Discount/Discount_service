server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:file:./data/discount;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Kolkata
  servlet:
    multipart:
      max-file-size: 12MB
      max-request-size: 12MB
app:
  upload-dir: ./uploads
  session-header: X-Session-Token
  otp:
    provider: ${OTP_PROVIDER:console}
    ttl-seconds: ${OTP_TTL_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    sms-template: "${OTP_SMS_TEMPLATE:Your OTP for Nagashree Service Station Login is: {otp}}"
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:}
    auth-token: ${TWILIO_AUTH_TOKEN:}
    from-number: ${TWILIO_FROM_NUMBER:}
    verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  pump:
    lat: 13.765987
    lng: 76.852652
    radius-meters: 50
  admin-phones: ${ADMIN_PHONES:}
  employee-phones: ${EMPLOYEE_PHONES:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-flash-latest}
